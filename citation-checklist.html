<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 12-Point Citation Blind-Spot Checklist — for newsletter writers</title>
<meta name="description" content="Free: the 12-point checklist newsletter writers run before hitting send. Catch the unverifiable claim before a reader does. No signup.">
<style>
:root{--bg:#0a0e14;--card:#161b22;--border:#30363d;--txt:#e6edf3;--dim:#8b949e;--acc:#4fc3f7;--grn:#3fb950}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;justify-content:center;padding:40px 16px}
.wrap{max-width:640px;width:100%}
h1{font-size:1.7rem;margin-bottom:6px;text-align:center}h1 span{color:var(--acc)}
.sub{color:var(--dim);text-align:center;margin-bottom:28px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px}
label{display:flex;gap:12px;align-items:flex-start;color:var(--txt);font-size:.95rem;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
label:last-child{border-bottom:none}
input{accent-color:var(--acc);margin-top:3px}
.count{text-align:center;color:var(--dim);margin:18px 0;font-size:1rem}
.count b{color:var(--grn);font-size:1.6rem}
.cta{display:block;text-align:center;background:var(--acc);color:#001018;font-weight:700;padding:14px;border-radius:10px;text-decoration:none}
footer{margin-top:24px;text-align:center;color:var(--dim);font-size:.8rem}
</style></head>
<body><div class="wrap">
<h1>The 12-Point <span>Citation Blind-Spot Checklist</span></h1>
<p class="sub">Run it on your next issue before a reader runs it for you.</p>
<div class="card" id="list"></div>
<div class="count"><b id="n">0</b>/12 checked</div>
<a class="cta" href="mailto:absbm14@gmail.com?subject=CiteSentry%20—%20audit%20my%20issue">▶ CiteSentry: the $9/issue audit that catches what checklists miss</a>
<footer>Free tool. No signup. Everything runs in your browser.</footer>
</div>
<script>
const ITEMS=[
"Every statistic names its source and year",
"No 'studies show' without a linked study",
"Quotes verified against the original transcript/context",
"Links checked live (not 404/paywalled unexpectedly)",
"Percentages reconcile with their base numbers",
"'Up to X' claims state the realistic range",
"Survey/data claims note sample size and who paid",
"Charts match the numbers in the text",
"Competitor/market claims dated within 12 months",
"Expert titles/affiliations current",
"Headline claim supported by body evidence",
"Corrections policy exists and past corrections linked"
];
const list=document.getElementById('list');
ITEMS.forEach((t,i)=>{
const l=document.createElement('label');
const c=document.createElement('input');c.type='checkbox';c.onchange=upd;
l.appendChild(c);l.appendChild(document.createTextNode(t));list.appendChild(l);
});
function upd(){document.getElementById('n').textContent=document.querySelectorAll('input:checked').length;}
</script></body></html>
