<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 60-Second Support Test — is your DTC support leaking?</title>
<meta name="description" content="Free self-test: 6 questions scoring your support flow against DTC chargeback-correlated benchmarks. No signup.">
<style>
:root{--bg:#0a0e14;--card:#161b22;--border:#30363d;--txt:#e6edf3;--dim:#8b949e;--acc:#4fc3f7;--red:#f85149;--grn:#3fb950}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;justify-content:center;padding:40px 16px}
.wrap{max-width:640px;width:100%}
h1{font-size:1.7rem;margin-bottom:6px;text-align:center}h1 span{color:var(--acc)}
.sub{color:var(--dim);text-align:center;margin-bottom:28px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px}
.q{color:var(--txt);font-size:1rem;margin-bottom:12px;font-weight:600}
label{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:.9rem;padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin:6px 0;cursor:pointer}
label:hover{border-color:var(--acc)}
input[type=radio]{accent-color:var(--acc)}
.result{margin-top:24px;text-align:center;padding:28px;border-radius:12px;background:linear-gradient(135deg,#1a0f0f,#161b22);border:1px solid #f8514944}
.big{font-size:2.6rem;font-weight:800;margin:8px 0;font-variant-numeric:tabular-nums}
.verdict{font-size:1rem;margin-bottom:8px}
.breakdown{color:var(--dim);font-size:.9rem}
.cta{display:block;margin-top:24px;text-align:center;background:var(--acc);color:#001018;font-weight:700;padding:14px;border-radius:10px;text-decoration:none}
footer{margin-top:24px;text-align:center;color:var(--dim);font-size:.8rem}
</style></head>
<body><div class="wrap">
<h1>The 60-Second <span>Support Test</span></h1>
<p class="sub">6 questions. Honest answers. Your leak score.</p>
<div class="card" id="quiz"></div>
<div class="result" id="res" style="display:none">
<div class="verdict" id="verdict"></div>
<div class="big" id="score">0/6</div>
<div class="breakdown" id="note"></div>
<a class="cta" href="mailto:absbm14@gmail.com?subject=SupportGap%20—%20audit%20our%20support">▶ SupportGap: the $29 audit that maps every bail point</a>
</div>
<footer>Free tool. No signup. Benchmarks: WISMO deflection, callback placement, first-contact resolution.</footer>
</div>
<script>
const QS=[
["A customer calls about a late order during your fulfillment window. Who answers?",["A person or callback offer","Voicemail","We mostly miss it"]],
["Average email reply time for WISMO ('where is my order'):",["Under 4 hours","4–24 hours","Over 24 hours"]],
["Do you have a self-service order-status page?",["Yes, linked in every shipping email","Yes but hard to find","No"]],
["When a support call goes to voicemail, the caller gets:",["A text-back with order-status link","Just the beep","We don't know"]],
["Your chargebacks last quarter were:",["Under 0.4% of orders","0.4–0.9%","Over 0.9% or unknown"]],
["Support requests get answered:",["7 days a week","Weekdays","Whenever someone looks"]]
];
const V=[2,0,-2];
const quiz=document.getElementById('quiz');
QS.forEach((q,qi)=>{
const d=document.createElement('div');d.className='q';d.textContent=(qi+1)+'. '+q[0];quiz.appendChild(d);
q[1].forEach((opt,oi)=>{
const l=document.createElement('label');
const r=document.createElement('input');r.type='radio';r.name='q'+qi;r.value=oi;r.onchange=score;
l.appendChild(r);l.appendChild(document.createTextNode(opt));quiz.appendChild(l);
});
});
let done=false;
function score(){
const ans=[...document.querySelectorAll('input:checked')];
if(ans.length<QS.length||done)return;done=true;
let s=0;ans.forEach(a=>s+=V[+a.value]);
document.getElementById('res').style.display='block';
document.getElementById('score').textContent=s+'/12';
const v=document.getElementById('verdict');
if(s>=8){v.textContent='✓ Tight ship';v.style.color='var(--grn)';document.getElementById('note').textContent='Defend the position — benchmark quarterly.';}
else if(s>=3){v.textContent='⚠ Quiet leaks';v.style.color='#f0b429';document.getElementById('note').textContent='The bail points are costing reorders silently.';}
else{v.textContent='✗ Support-driven churn';v.style.color='var(--red)';document.getElementById('note').textContent='Every unanswered WISMO is a chargeback in embryo.';}
window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
</script></body></html>
