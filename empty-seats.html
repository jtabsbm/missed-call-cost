<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empty Seats Calculator — what no-shows cost your live course calls</title>
<meta name="description" content="Free: what ghosted attendees cost course creators per cohort. No signup.">
<style>
:root{--bg:#0a0e14;--card:#161b22;--border:#30363d;--txt:#e6edf3;--dim:#8b949e;--acc:#4fc3f7;--red:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;justify-content:center;padding:40px 16px}
.wrap{max-width:640px;width:100%}
h1{font-size:1.7rem;margin-bottom:6px;text-align:center}h1 span{color:var(--acc)}
.sub{color:var(--dim);text-align:center;margin-bottom:32px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px}
label{display:block;color:var(--dim);font-size:.85rem;margin-bottom:8px;font-weight:600}
.row{display:flex;gap:16px;flex-wrap:wrap}.field{flex:1;min-width:140px}
input[type=number]{width:100%;background:#0d1117;border:1px solid var(--border);border-radius:8px;color:var(--txt);padding:12px;font-size:1.1rem}
input:focus{outline:none;border-color:var(--acc)}
.result{margin-top:24px;text-align:center;padding:28px;border-radius:12px;background:linear-gradient(135deg,#1a0f0f,#161b22);border:1px solid #f8514944}
.big{font-size:2.8rem;font-weight:800;color:var(--red);margin:8px 0;font-variant-numeric:tabular-nums}
.breakdown{color:var(--dim);font-size:.9rem}
.cta{display:block;margin-top:24px;text-align:center;background:var(--acc);color:#001018;font-weight:700;padding:14px;border-radius:10px;text-decoration:none}
footer{margin-top:24px;text-align:center;color:var(--dim);font-size:.8rem}
</style></head>
<body><div class="wrap">
<h1>Empty <span>Seats Calculator</span></h1>
<p class="sub">You sold the seats. A third of them stay empty.</p>
<div class="card">
<div class="row">
<div class="field"><label>Enrolled per cohort</label><input type="number" id="enrolled" value="50" min="1"></div>
<div class="field"><label>No-show rate (%)</label><input type="number" id="noshow" value="30" min="1" max="90"></div>
</div>
<div class="row" style="margin-top:16px">
<div class="field"><label>Price per seat ($)</label><input type="number" id="price" value="299" min="1"></div>
<div class="field"><label>Live calls per cohort</label><input type="number" id="calls" value="8" min="1"></div>
</div>
</div>
<div class="result">
<div style="color:var(--dim);font-size:.85rem;text-transform:uppercase;letter-spacing:.08em">Value seated empty, per cohort</div>
<div class="big" id="waste">$—</div>
<div class="breakdown" id="seats">— empty seats per call</div>
<div class="breakdown" id="refunds"></div>
</div>
<a class="cta" href="mailto:absbm14@gmail.com?subject=ShowRate%20—%20our%20empty%20seats">▶ ShowRate: the $29 report that recovers the room</a>
<footer>Free tool. No signup. Math: enrolled × rate × price; refund-risk = × 20%.</footer>
</div>
<script>
const $=id=>document.getElementById(id);
function calc(){
const e=+$('enrolled').value||0,n=(+$('noshow').value||0)/100,p=+$('price').value||0,c=+$('calls').value||1;
const empty=Math.round(e*n);
$('waste').textContent='$'+(empty*p).toLocaleString();
$('seats').textContent=empty+' empty seats × '+c+' calls';
$('refunds').textContent='refund-pressure risk: $'+Math.round(empty*p*0.2).toLocaleString()+' (the 20% who notice they missed it)';
}
['enrolled','noshow','price','calls'].forEach(i=>$(i).addEventListener('input',calc));calc();
</script></body></html>
