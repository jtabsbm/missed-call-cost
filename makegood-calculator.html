<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make-Good Liability Calculator — how much do you owe clients?</title>
<meta name="description" content="Free calculator: untracked make-good credits and promised deliverables owed to clients. Find your agency's hidden liability. No signup.">
<style>
:root{--bg:#0a0e14;--card:#161b22;--border:#30363d;--txt:#e6edf3;--dim:#8b949e;--acc:#4fc3f7;--red:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;justify-content:center;padding:40px 16px}
.wrap{max-width:640px;width:100%}
h1{font-size:1.7rem;margin-bottom:6px;text-align:center}h1 span{color:var(--acc)}
.sub{color:var(--dim);text-align:center;margin-bottom:32px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px}
label{display:block;color:var(--dim);font-size:.85rem;margin-bottom:8px;font-weight:600}
.row{display:flex;gap:16px;flex-wrap:wrap}.field{flex:1;min-width:140px}
input[type=number]{width:100%;background:#0d1117;border:1px solid var(--border);border-radius:8px;color:var(--txt);padding:12px;font-size:1.1rem}
input:focus{outline:none;border-color:var(--acc)}
.result{margin-top:24px;text-align:center;padding:28px;border-radius:12px;background:linear-gradient(135deg,#1a0f0f,#161b22);border:1px solid #f8514944}
.big{font-size:2.8rem;font-weight:800;color:var(--red);margin:8px 0;font-variant-numeric:tabular-nums}
.breakdown{color:var(--dim);font-size:.9rem}
.cta{display:block;margin-top:24px;text-align:center;background:var(--acc);color:#001018;font-weight:700;padding:14px;border-radius:10px;text-decoration:none}
footer{margin-top:24px;text-align:center;color:var(--dim);font-size:.8rem}
</style></head>
<body><div class="wrap">
<h1>Make-Good <span>Liability Calculator</span></h1>
<p class="sub">Promised credits nobody tracked. Find your agency's number.</p>
<div class="card">
<div class="row">
<div class="field"><label>Active clients</label><input type="number" id="clients" value="12" min="1"></div>
<div class="field"><label>Make-good promises per client / yr</label><input type="number" id="promises" value="2" min="0"></div>
</div>
<div class="row" style="margin-top:16px">
<div class="field"><label>Avg make-good value ($)</label><input type="number" id="value" value="1200" min="0"></div>
<div class="field"><label>% tracked anywhere</label><input type="number" id="tracked" value="20" min="0" max="100"></div>
</div>
</div>
<div class="result">
<div style="color:var(--dim);font-size:.85rem;text-transform:uppercase;letter-spacing:.08em">Untracked liability, per year</div>
<div class="big" id="liability">$—</div>
<div class="breakdown" id="detail">—</div>
<div class="breakdown" id="risk"></div>
</div>
<a class="cta" href="mailto:absbm14@gmail.com?subject=ClaimCycle%20—%20track%20our%20make-goods">▶ ClaimCycle: the $350 ledger that ends make-good drag</a>
<footer>Free tool. No signup. Math: clients × promises × value × (1 − tracked%).</footer>
</div>
<script>
const $=id=>document.getElementById(id);
function calc(){
const c=+$('clients').value||0,p=+$('promises').value||0,v=+$('value').value||0,t=(+$('tracked').value||0)/100;
const total=c*p*v, untracked=total*(1-t);
$('liability').textContent='$'+Math.round(untracked).toLocaleString();
$('detail').textContent=Math.round(c*p*(1-t))+' untracked promises · $'+v.toLocaleString()+' avg';
$('risk').textContent= untracked>10000 ? '⚠ renewal-negotiation hazard' : 'manageable — keep it that way';
}
['clients','promises','value','tracked'].forEach(i=>$(i).addEventListener('input',calc));calc();
</script></body></html>
